{% extends 'base.html' %}
{% load static %}

{% block title %}
EBooks
{% endblock %}

{% block Body %}
<section class="ebook-section">
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px;">
        {% for ebook in ebooks %}
        <div style="border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <img src="{{ ebook.cover_image.url }}" alt="{{ ebook.title }}" style="width: 100%; height: 250px; object-fit: cover; border-radius: 4px;">
            <h3 style="margin: 10px 0 5px 0; font-size: 18px;">{{ ebook.title }}</h3>
            <p style="color: #666; margin: 0 0 15px 0; font-size: 14px;">{{ ebook.author }}</p>
            <a href="{{ ebook.pdf_file.url }}" target="_blank" style="display: inline-block; background: #007bff; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; font-weight: bold;">Read</a>
        </div>
        {% empty %}
        <p>No ebooks available at the moment.</p>
        {% endfor %}
    </div>
</section>
{% endblock %}
