{% load static %}

<section class="py-5">

    <div class="container">

        <!-- Trending Books -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold">
                🔥 Trending Now
            </h2>

            <a href="/books/" class="btn btn-outline-primary">
                View All
            </a>

        </div>

        <div class="row g-4">

            {% for i in rng %}

            <div class="col-6 col-md-4 col-lg-3 col-xl-2">

                <div class="card h-100 shadow-sm border-0 book-card">

                    <img src="{% static 'images/1984.jpeg' %}"
                         class="card-img-top"
                         alt="Book">

                    <div class="card-body text-center">

                        <h6 class="fw-bold">
                            Book {{i}}
                        </h6>

                        <p class="text-muted small mb-3">
                            George Orwell
                        </p>

                        <button
                            class="btn btn-primary w-100 issue-btn"
                            data-id="{{i}}">

                            <i class="bi bi-book me-1"></i>

                            Issue Book

                        </button>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>



        <!-- Literature -->

        <div class="d-flex justify-content-between align-items-center mt-5 mb-4">

            <h2 class="fw-bold">
                📖 Literature
            </h2>

            <a href="/books/" class="btn btn-outline-primary">
                View All
            </a>

        </div>

        <div class="row g-4">

            {% for i in rng %}

            <div class="col-6 col-md-4 col-lg-3 col-xl-2">

                <div class="card h-100 shadow-sm border-0 book-card">

                    <img src="{% static 'images/1984.jpeg' %}"
                         class="card-img-top"
                         alt="Book">

                    <div class="card-body text-center">

                        <h6 class="fw-bold">
                            Book {{i}}
                        </h6>

                        <p class="text-muted small mb-3">
                            George Orwell
                        </p>

                        <button
                            class="btn btn-success w-100 issue-btn"
                            data-id="{{i}}">

                            <i class="bi bi-journal-check me-1"></i>

                            Issue Book

                        </button>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</section>

<script src="{% static 'js/book_card.js' %}"></script>
