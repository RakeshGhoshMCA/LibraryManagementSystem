{% extends 'base.html' %}
{% load static %}

{% block title %}
Sign In
{% endblock %}

{% block Body %}

<section class="login-section">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-10">

                <div class="card login-card shadow-lg border-0">

                    <div class="row g-0">

                        <!-- Left Side -->
                        <div class="col-lg-6 login-left d-none d-lg-flex">

                            <div class="text-center text-white">

                                <img src="{% static 'images/logo.png' %}" class="mb-4 login-logo">

                                <h2 class="fw-bold">
                                    Welcome Back
                                </h2>

                                <p class="mt-3">
                                    Sign in to access thousands of books,
                                    study materials, and library resources.
                                </p>

                            </div>

                        </div>

                        <!-- Right Side -->
                        <div class="col-lg-6">

                            <div class="p-5">

                                <h2 class="fw-bold mb-4 text-center">
                                    Sign In
                                </h2>

                                <form method="POST">

                                    {% csrf_token %}

                                    <div class="mb-3">

                                        <label class="form-label">
                                            Email Address
                                        </label>

                                        <input
                                            type="email"
                                            name="email"
                                            class="form-control form-control-lg"
                                            placeholder="Enter your email"
                                            required>

                                    </div>

                                    <div class="mb-3">

                                        <label class="form-label">
                                            Password
                                        </label>

                                        <input
                                            type="password"
                                            name="password"
                                            class="form-control form-control-lg"
                                            placeholder="Enter your password"
                                            required>

                                    </div>

                                    <div class="d-flex justify-content-between mb-4">

                                        <div class="form-check">

                                            <input
                                                class="form-check-input"
                                                type="checkbox"
                                                id="remember">

                                            <label class="form-check-label" for="remember">
                                                Remember Me
                                            </label>

                                        </div>

                                        <a href="#" class="text-decoration-none">
                                            Forgot Password?
                                        </a>

                                    </div>

                                    <button class="btn btn-primary w-100 btn-lg">

                                        Sign In

                                    </button>

                                </form>

                                <hr class="my-4">

                                <p class="text-center mb-0">

                                    Don't have an account?

                                    <a href="{% url 'signup' %}"
                                       class="fw-bold text-decoration-none">

                                        Create Account

                                    </a>

                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
