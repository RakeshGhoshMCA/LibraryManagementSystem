{% extends 'base.html' %}
{% load static %}

{% block title %}
Sign Up
{% endblock %}

{% block Body %}

<section class="signup-section">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-10">

                <div class="card signup-card shadow-lg border-0">

                    <div class="row g-0">

                        <!-- Left Side -->
                        <div class="col-lg-6 signup-left d-none d-lg-flex">

                            <div class="text-center text-white">

                                <img src="{% static 'images/logo.png' %}"
                                     class="signup-logo mb-4"
                                     alt="BookHub">

                                <h2 class="fw-bold">
                                    Join BookHub
                                </h2>

                                <p class="mt-3">
                                    Create your account and get access to thousands
                                    of books, journals, and digital resources.
                                </p>

                            </div>

                        </div>

                        <!-- Right Side -->
                        <div class="col-lg-6">

                            <div class="p-5">

                                <h2 class="text-center fw-bold mb-4">
                                    Create Account
                                </h2>

                                <form method="POST">

                                    {% csrf_token %}

                                    <div class="mb-3">

                                        <label class="form-label">
                                            Email Address
                                        </label>

                                        <input
                                            type="email"
                                            name="email"
                                            class="form-control form-control-lg"
                                            placeholder="Enter your email"
                                            required>

                                    </div>

                                    <div class="mb-3">

                                        <label class="form-label">
                                            Password
                                        </label>

                                        <input
                                            type="password"
                                            name="password1"
                                            class="form-control form-control-lg"
                                            placeholder="Create password"
                                            required>

                                    </div>

                                    <div class="mb-4">

                                        <label class="form-label">
                                            Confirm Password
                                        </label>

                                        <input
                                            type="password"
                                            name="password2"
                                            class="form-control form-control-lg"
                                            placeholder="Confirm password"
                                            required>

                                    </div>

                                    <div class="form-check mb-4">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               required
                                               id="terms">

                                        <label class="form-check-label" for="terms">

                                            I agree to the Terms & Conditions

                                        </label>

                                    </div>

                                    <button class="btn btn-primary btn-lg w-100">

                                        Create Account

                                    </button>

                                </form>

                                <hr class="my-4">

                                <p class="text-center mb-0">

                                    Already have an account?

                                    <a href="{% url 'signin' %}"
                                       class="fw-bold text-decoration-none">

                                        Sign In

                                    </a>

                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
